<script>
  // ============================================
  // 🆕 CREDENZIALI NUOVO SUPABASE
  // ============================================
  const SUPABASE_URL = 'https://nwzhzwekpkxxsnmkxnzg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VIhpkQmEfYN9YIQ9lhaUyQ_CSxOcSfl';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

 const AVAILABLE_LOGOS = [
  'eurospin.png', 'lidl.png', 'despar.png', 'md.png', 'conad.png',
  'ard.png', 'acqua.png', 'todis.png', 'sisa.png', 'crai.png', 'demma.png'
];

  const BI_ICONS = [
    'bi-shop', 'bi-cart3', 'bi-basket', 'bi-bag', 'bi-droplet-fill',
    'bi-cup-straw', 'bi-egg-fill', 'bi-flower1', 'bi-house-fill',
    'bi-lightning-charge-fill', 'bi-snow2', 'bi-fire', 'bi-tree-fill',
    'bi-star-fill', 'bi-heart-fill', 'bi-gift-fill', 'bi-truck', 'bi-store'
  ];

  const DEFAULT_STORES = [
    { id: 'generico', name: 'Generico', color: '#64748b', icon: null },
    { id: 'eurospin', name: 'Eurospin', color: '#f7c600', icon: { type: 'img', src: 'eurospin.png' } },
    { id: 'ard', name: 'ARD', color: '#e30613', icon: { type: 'img', src: 'ard.png' } },
    { id: 'lidl', name: 'Lidl', color: '#0050aa', icon: { type: 'img', src: 'lidl.png' } },
    { id: 'conad', name: 'Conad', color: '#f26522', icon: { type: 'img', src: 'conad.png' } },
    { id: 'todis', name: 'Todis', color: '#e30613', icon: { type: 'img', src: 'todis.png' } },
    { id: 'crai', name: 'Crai', color: '#00923f', icon: { type: 'img', src: 'crai.png' } },
    { id: 'coop', name: 'Coop', color: '#005eb8', icon: null },
    { id: 'md', name: 'MD', color: '#e30613', icon: { type: 'img', src: 'md.png' } },
    { id: 'sisa', name: 'Sisa', color: '#00923f', icon: { type: 'img', src: 'sisa.png' } },
    { id: 'despar', name: 'Despar', color: '#00923f', icon: { type: 'img', src: 'despar.png' } },
  ];

  const DEFAULT_ICON_MAP = {};
  DEFAULT_STORES.forEach(s => { if (s.icon) DEFAULT_ICON_MAP[s.id] = s.icon; });

  const DEFAULT_OPERATORS = { A: 'Martina', B: 'Salvo' };
  const HISTORY_MAX = 10;
  const EMOJI_QUICK = ['🎃','🎄','🎉','🥳','🎂','🍕','🍿','⚽','🎁','❤️','🌸','⭐','🔥','🍾','🎈','🎭','🐰','🌞','🍬','🏖️','🎬','🌺','🍷','🎵','🍻'];

  let items = [];
  let currentOperator = 'A';
  let pendingPrice = null;
  let offerConfirmed = false;
  let sheetOpen = false;
  let collapsedStores = new Set();
  let customStores = null;
  let customOperators = null;
  let isDark = false;
  let settingsLoaded = false;
  let realtimeTimeout = null;
  let lastItemsCount = -1;
  let searchQuery = '';
  let favorites = [];
  let isFavorite = false;
  let autocompleteTimeout = null;
  let editingItemId = null;
  let history = [];
  let historyOpen = false;
  let quickAddOpenStore = null;
  let quickAddValue = '';
  let activeEventFilter = null;
  let selectMode = false;
  let selectedIds = new Set();
  let bulkAction = 'store';
  let iconPickerStoreId = null;

  let longPressTimer = null;
  let longPressTargetId = null;
  let longPressTriggered = false;
  const LONG_PRESS_DURATION = 550;

  function migrateStores(stores) {
    if (!Array.isArray(stores)) return stores;
    return stores.map(s => {
      if (s && !s.icon && DEFAULT_ICON_MAP[s.id]) {
        return Object.assign({}, s, { icon: DEFAULT_ICON_MAP[s.id] });
      }
      return s;
    });
  }

  function loadLocalSettings() {
    try {
      const s = localStorage.getItem('marbon_local');
      if (s) {
        const p = JSON.parse(s);
        isDark = p.dark || false;
        collapsedStores = new Set(p.collapsed || []);
        favorites = p.favorites || [];
        currentOperator = (p.currentOp === 'B') ? 'B' : 'A';
      }
    } catch(e) { console.error(e); }
    try {
      const h = localStorage.getItem('marbon_history');
      if (h) {
        const parsed = JSON.parse(h);
        history = Array.isArray(parsed) ? parsed.slice(0, HISTORY_MAX) : [];
      }
      historyOpen = localStorage.getItem('marbon_history_open') === '1';
    } catch(e) { history = []; }
    if (isDark) document.body.classList.add('dark');
    updateDarkToggle();
  }

  function saveLocalSettings() {
    localStorage.setItem('marbon_local', JSON.stringify({
      dark: isDark,
      collapsed: Array.from(collapsedStores),
      favorites: favorites,
      currentOp: currentOperator
    }));
  }

  function saveHistory() {
    localStorage.setItem('marbon_history', JSON.stringify(history.slice(0, HISTORY_MAX)));
  }

  async function loadSharedSettings() {
    try {
      const { data, error } = await supabase
        .from('settings')
        .select('*')
        .eq('id', 'global')
        .single();
      
      if (error) {
        customStores = DEFAULT_STORES;
        customOperators = DEFAULT_OPERATORS;
      } else {
        customStores = migrateStores(data.stores || DEFAULT_STORES);
        customOperators = data.operators || DEFAULT_OPERATORS;
      }
      
      settingsLoaded = true;
      syncOperatorUI();
      initStoreSelect();
      initEventSelect();
      render();
    } catch (err) {
      console.error('Errore:', err);
      customStores = DEFAULT_STORES;
      customOperators = DEFAULT_OPERATORS;
      settingsLoaded = true;
      syncOperatorUI();
      initStoreSelect();
      initEventSelect();
      render();
    }
  }

  async function saveSharedSettings() {
    try {
      const { error } = await supabase
        .from('settings')
        .upsert({
          id: 'global',
          operators: customOperators,
          stores: customStores,
          updated_at: new Date().toISOString()
        });
      if (error) throw error;
      showSaveIndicator();
    } catch (err) {
      console.error('Errore salvataggio:', err);
      alert('Errore nel salvataggio: ' + err.message);
    }
  }

  function showIndicator(msg) {
    const el = document.getElementById('saveIndicator');
    const textEl = document.getElementById('saveIndicatorText');
    textEl.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }
  function showSaveIndicator() { showIndicator('Salvato'); }

  supabase
    .channel('settings-changes')
    .on('postgres_changes', 
      { event: '*', schema: 'public', table: 'settings' }, 
      (payload) => {
        if (payload.new) {
          customStores = migrateStores(payload.new.stores || DEFAULT_STORES);
          customOperators = payload.new.operators || DEFAULT_OPERATORS;
          syncOperatorUI();
          initStoreSelect();
          initEventSelect();
          if (document.getElementById('settingsOverlay').classList.contains('show')) renderStoresList();
          render();
        }
      }
    )
    .subscribe();

  function getStores() { return customStores || DEFAULT_STORES; }
  function getOperators() { return customOperators || DEFAULT_OPERATORS; }
  function getEvents() { return (getOperators() && getOperators().events) || []; }
  function getStore(id) { return getStores().find(s => s.id === id) || getStores()[0]; }
  function getEvent(id) { return getEvents().find(e => e.id === id) || null; }
  function getOpName(key) { return getOperators()[key] || key; }

  function storeLogoHTML(store, sizeClass) {
    const initials = (store.name || '?').substring(0, 2).toUpperCase();
    const icon = store.icon;
    let inner = `<span>${escapeHtml(initials)}</span>`;
    if (icon && icon.type === 'bi') {
      inner = `<i class="bi ${icon.name}"></i>`;
    } else if (icon && icon.type === 'img') {
      inner = `<span>${escapeHtml(initials)}</span><img class="logo-img" src="${icon.src}" onerror="this.style.display='none'" alt="">`;
    }
    return `<div class="store-logo ${sizeClass || ''}" style="background:${store.color}">${inner}</div>`;
  }

  function syncOperatorUI() {
    const ops = getOperators();
    const qopA = document.getElementById('qopA');
    const qopB = document.getElementById('qopB');
    const opBtnA = document.getElementById('opBtnA');
    const opBtnB = document.getElementById('opBtnB');
    if (qopA) { qopA.innerHTML = `<i class="bi bi-heart-fill"></i> ${ops.A}`; qopA.classList.toggle('active', currentOperator === 'A'); }
    if (qopB) { qopB.innerHTML = `<i class="bi bi-heart-fill"></i> ${ops.B}`; qopB.classList.toggle('active', currentOperator === 'B'); }
    if (opBtnA) { opBtnA.textContent = ops.A; opBtnA.classList.toggle('active', currentOperator === 'A'); }
    if (opBtnB) { opBtnB.textContent = ops.B; opBtnB.classList.toggle('active', currentOperator === 'B'); }
  }

  window.setOperator = function(op) {
    currentOperator = (op === 'B') ? 'B' : 'A';
    saveLocalSettings();
    syncOperatorUI();
  };

  function updateDarkToggle() {
    const t = document.getElementById('darkToggle');
    if (isDark) t.classList.add('active'); else t.classList.remove('active');
  }

  const listEl = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const itemInput = document.getElementById('itemInput');
  const qtyInput = document.getElementById('qtyInput');
  const storeSelect = document.getElementById('storeSelect');
  const eventSelect = document.getElementById('eventSelect');
  const offerCheckbox = document.getElementById('offerCheckbox');
  const offerWrapper = document.getElementById('offerWrapper');
  const expiryWrapper = document.getElementById('expiryWrapper');
  const expiryInput = document.getElementById('expiryInput');
  const sheetOverlay = document.getElementById('sheetOverlay');
  const fabBtn = document.getElementById('fabBtn');
  const priceModal = document.getElementById('priceModal');
  const priceInput = document.getElementById('priceInput');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const autocompleteDropdown = document.getElementById('autocompleteDropdown');
  const favoriteStar = document.getElementById('favoriteStar');
  const sheetTitle = document.getElementById('sheetTitle');
  const actionBtn = document.getElementById('actionBtn');
  const deleteEditBtn = document.getElementById('deleteEditBtn');

  function initStoreSelect() {
    storeSelect.innerHTML = '';
    getStores().forEach(store => {
      const option = document.createElement('option');
      option.value = store.id;
      option.textContent = store.name;
      storeSelect.appendChild(option);
    });
  }

  function initEventSelect() {
    const evs = getEvents();
    eventSelect.innerHTML = '<option value="">Nessun evento</option>' + evs.map(e =>
      `<option value="${e.id}">${e.emoji} ${escapeHtml(e.name)}</option>`
    ).join('');
  }

  offerCheckbox.addEventListener('change', () => {
    if (offerCheckbox.checked) {
      offerWrapper.classList.add('checked');
      expiryWrapper.classList.add('show');
      openPriceModal();
    } else {
      offerWrapper.classList.remove('checked');
      expiryWrapper.classList.remove('show');
      pendingPrice = null;
      offerConfirmed = false;
      expiryInput.value = '';
    }
  });

  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value.trim().toLowerCase();
    if (searchQuery.length > 0) searchClear.classList.add('show');
    else searchClear.classList.remove('show');
    render();
  });

  window.clearSearch = function() {
    searchInput.value = '';
    searchQuery = '';
    searchClear.classList.remove('show');
    render();
    searchInput.focus();
  };

  itemInput.addEventListener('input', (e) => {
    const value = e.target.value.trim();
    clearTimeout(autocompleteTimeout);
    if (value.length < 2) {
      autocompleteDropdown.classList.remove('show');
      return;
    }
    autocompleteTimeout = setTimeout(() => showAutocomplete(value), 200);
  });

  itemInput.addEventListener('focus', () => {
    if (itemInput.value.trim().length >= 2) showAutocomplete(itemInput.value.trim());
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.input-wrapper')) autocompleteDropdown.classList.remove('show');
    if (quickAddOpenStore && !e.target.closest('.quick-add-row') && !e.target.closest('.store-add-btn')) {
      quickAddOpenStore = null;
      quickAddValue = '';
      render();
    }
  });

  function showAutocomplete(query) {
    const lowerQuery = query.toLowerCase();
    const matches = favorites.filter(fav => fav.name.toLowerCase().includes(lowerQuery)).slice(0, 5);
    if (matches.length === 0) {
      autocompleteDropdown.classList.remove('show');
      return;
    }
    autocompleteDropdown.innerHTML = `
      <div class="autocomplete-hint"><i class="bi bi-star-fill" style="color:var(--gold)"></i> Preferiti</div>
      ${matches.map(fav => `
        <div class="autocomplete-item" onclick="window.selectAutocomplete('${escapeHtml(fav.name)}', '${escapeHtml(fav.store || 'generico')}')">
          <span class="star-icon"><i class="bi bi-star-fill"></i></span>
          <span class="item-name-text">${escapeHtml(fav.name)}</span>
          <span class="item-store">${escapeHtml(getStore(fav.store).name)}</span>
        </div>
      `).join('')}
    `;
    autocompleteDropdown.classList.add('show');
  }

  window.selectAutocomplete = function(name, store) {
    itemInput.value = name;
    storeSelect.value = store;
    autocompleteDropdown.classList.remove('show');
    qtyInput.focus();
  };

  window.toggleFavorite = function() {
    isFavorite = !isFavorite;
    if (isFavorite) {
      favoriteStar.classList.add('active');
      favoriteStar.querySelector('.star').textContent = '★';
      favoriteStar.querySelector('.text').textContent = 'Rimosso dai preferiti';
    } else {
      favoriteStar.classList.remove('active');
      favoriteStar.querySelector('.star').textContent = '☆';
      favoriteStar.querySelector('.text').textContent = 'Salva come preferito';
    }
  };

  async function saveEvents(newEvents) {
    const ops = getOperators();
    customOperators = { A: ops.A, B: ops.B, events: newEvents };
    await saveSharedSettings();
    initEventSelect();
    renderEventsList();
    render();
  }

  window.setQuickEmoji = function(emoji) {
    document.getElementById('newEventEmoji').value = emoji;
  };

  window.addEvent = async function() {
    const emoji = document.getElementById('newEventEmoji').value.trim();
    const name = document.getElementById('newEventName').value.trim();
    if (!emoji || !name) { alert('Inserisci emoji e nome dell\'evento'); return; }
    const evs = getEvents().slice();
    evs.push({ id: 'ev_' + Date.now(), name, emoji });
    document.getElementById('newEventEmoji').value = '';
    document.getElementById('newEventName').value = '';
    await saveEvents(evs);
    showIndicator('Evento creato');
  };

  window.deleteEvent = async function(id) {
    if (!confirm('Eliminare questo evento? I prodotti perderanno il tag.')) return;
    const evs = getEvents().filter(e => e.id !== id);
    if (activeEventFilter === id) activeEventFilter = null;
    const ids = items.filter(i => i.eventId === id).map(i => i.id).filter(x => !x.startsWith('temp_'));
    items.forEach(i => { if (i.eventId === id) i.eventId = null; });
    if (ids.length) {
      try { await supabase.from('lista').update({ event_id: null }).in('id', ids); } catch(e) { console.error(e); }
    }
    await saveEvents(evs);
  };

  window.updateEventName = async function(id, name) {
    const evs = getEvents().slice();
    const e = evs.find(x => x.id === id);
    if (e) e.name = name.trim() || e.name;
    await saveEvents(evs);
  };

  window.updateEventEmoji = async function(id, emoji) {
    const evs = getEvents().slice();
    const e = evs.find(x => x.id === id);
    if (e && emoji.trim()) e.emoji = emoji.trim();
    await saveEvents(evs);
  };

  function renderEventsList() {
    const container = document.getElementById('eventsList');
    const evs = getEvents();
    const quick = document.getElementById('emojiQuick');
    quick.innerHTML = EMOJI_QUICK.map(e => `<button type="button" onclick="window.setQuickEmoji('${e}')">${e}</button>`).join('');
    if (evs.length === 0) {
      container.innerHTML = '<div class="history-empty">Nessun evento. Creane uno qui sotto.</div>';
      return;
    }
    container.innerHTML = evs.map(e => `
      <div class="settings-row">
        <input type="text" class="emoji-mini" value="${e.emoji}" maxlength="4" onchange="window.updateEventEmoji('${e.id}', this.value)">
        <input type="text" value="${escapeHtml(e.name)}" maxlength="30" onchange="window.updateEventName('${e.id}', this.value)">
        <button class="delete-small" onclick="window.deleteEvent('${e.id}')"><i class="bi bi-trash-fill"></i></button>
      </div>
    `).join('');
  }

  window.setEventFilter = function(id) {
    activeEventFilter = id;
    render();
  };

  function renderFilterRow() {
    const evs = getEvents();
    let chips = `<button class="filter-chip ${!activeEventFilter ? 'active' : ''}" onclick="window.setEventFilter(null)"><i class="bi bi-list-ul"></i> Tutti</button>`;
    evs.forEach(ev => {
      chips += `<button class="filter-chip ${activeEventFilter === ev.id ? 'active' : ''}" onclick="window.setEventFilter('${ev.id}')">${ev.emoji} ${escapeHtml(ev.name)}</button>`;
    });
    if (!evs.length) chips += `<span class="filter-chip muted"><i class="bi bi-stars"></i> Crea eventi nelle impostazioni</span>`;
    return `<div class="filter-row">${chips}</div>`;
  }

  window.toggleSelectMode = function() {
    if (selectMode) window.exitSelectMode();
    else {
      selectMode = true;
      selectedIds = new Set();
      document.body.classList.add('select-mode');
      document.getElementById('selectModeBtn').classList.add('sel-on');
      render();
    }
  };

  window.exitSelectMode = function() {
    selectMode = false;
    selectedIds = new Set();
    document.body.classList.remove('select-mode');
    document.getElementById('selectModeBtn').classList.remove('sel-on');
    render();
  };

  window.toggleSelect = function(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    render();
  };

  function renderBulkBar() {
    const bar = document.getElementById('bulkBar');
    if (selectMode) {
      bar.classList.add('show');
      document.getElementById('bulkCount').textContent = selectedIds.size + ' selezionati';
    } else {
      bar.classList.remove('show');
    }
  }

  function realSelectedIds() {
    return Array.from(selectedIds).filter(id => !id.startsWith('temp_'));
  }

  window.openBulk = function(type) {
    if (selectedIds.size === 0) { alert('Seleziona almeno un prodotto'); return; }
    bulkAction = type;
    const title = document.getElementById('bulkTitle');
    const list = document.getElementById('bulkList');
    if (type === 'store') {
      title.innerHTML = '<i class="bi bi-shop"></i> Sposta in negozio';
      list.innerHTML = getStores().map(s => `
        <div class="pick-item" onclick="window.applyBulkStore('${s.id}')">
          ${storeLogoHTML(s, 'sz-sm')}
          <div class="pick-name">${escapeHtml(s.name)}</div>
        </div>
      `).join('');
    } else {
      title.innerHTML = '<i class="bi bi-stars"></i> Assegna evento';
      list.innerHTML = `
        <div class="pick-item" onclick="window.applyBulkEvent(null)">
          <div class="pick-emoji"><i class="bi bi-x-circle" style="color:var(--text-muted)"></i></div>
          <div class="pick-name">Nessun evento</div>
        </div>
      ` + getEvents().map(e => `
        <div class="pick-item" onclick="window.applyBulkEvent('${e.id}')">
          <div class="pick-emoji">${e.emoji}</div>
          <div class="pick-name">${escapeHtml(e.name)}</div>
        </div>
      `).join('');
    }
    document.getElementById('bulkOverlay').classList.add('show');
  };

  window.closeBulk = function(e) {
    if (e && e.target !== document.getElementById('bulkOverlay')) return;
    document.getElementById('bulkOverlay').classList.remove('show');
  };

  window.applyBulkStore = async function(storeId) {
    const ids = realSelectedIds();
    items.forEach(i => { if (selectedIds.has(i.id)) i.store = storeId; });
    lastItemsCount = items.length;
    document.getElementById('bulkOverlay').classList.remove('show');
    try {
      if (ids.length) {
        const { error } = await supabase.from('lista').update({ store: storeId }).in('id', ids);
        if (error) throw error;
      }
      showIndicator('Spostati in ' + getStore(storeId).name);
      window.exitSelectMode();
      setTimeout(() => loadItems(), 800);
    } catch (err) {
      console.error(err);
      alert('Errore: ' + err.message);
    }
  };

  window.applyBulkEvent = async function(eventId) {
    const ids = realSelectedIds();
    items.forEach(i => { if (selectedIds.has(i.id)) i.eventId = eventId; });
    lastItemsCount = items.length;
    document.getElementById('bulkOverlay').classList.remove('show');
    try {
      if (ids.length) {
        await safeUpdate({ event_id: eventId }, ids);
      }
      const ev = eventId ? getEvent(eventId) : null;
      showIndicator(ev ? 'Evento assegnato' : 'Evento rimosso');
      window.exitSelectMode();
      setTimeout(() => loadItems(), 800);
    } catch (err) {
      console.error(err);
      alert('Errore: ' + err.message);
    }
  };

  function addToHistory(item) {
    const entry = {
      name: item.name,
      qty: item.qty || '',
      store: item.store || 'generico',
      operator: item.operator || 'A',
      onOffer: !!item.onOffer,
      price: (item.price !== undefined && item.price !== null) ? item.price : null,
      expiryDate: item.expiryDate || null,
      eventId: item.eventId || null
    };
    history = history.filter(e => !(e.name.toLowerCase() === entry.name.toLowerCase() && (e.store || 'generico') === entry.store));
    history.unshift(entry);
    history = history.slice(0, HISTORY_MAX);
    saveHistory();
  }

  window.toggleHistory = function() {
    historyOpen = !historyOpen;
    localStorage.setItem('marbon_history_open', historyOpen ? '1' : '0');
    render();
  };

  window.readdFromHistory = async function(idx) {
    const e = history[idx];
    if (!e) return;
    try {
      const payload = {
        name: e.name,
        qty: e.qty || '',
        store: e.store || 'generico',
        operator: e.operator || 'A',
        onoffer: !!e.onOffer,
        price: e.onOffer ? (e.price !== undefined && e.price !== null ? e.price : null) : null,
        expiry_date: e.onOffer ? (e.expiryDate || null) : null,
        event_id: e.eventId || null,
        done: false
      };
      await safeInsert(payload);
      items.push({
        id: 'temp_' + Date.now(),
        ...payload,
        onOffer: payload.onoffer,
        expiryDate: payload.expiry_date,
        eventId: payload.event_id,
        done: false
      });
      lastItemsCount = items.length;
      render();
      showIndicator('Rimesso in lista');
      setTimeout(() => loadItems(), 1000);
    } catch (err) {
      console.error('Errore:', err);
      alert('Errore: ' + err.message);
    }
  };

  window.editFromHistory = function(idx) {
    const e = history[idx];
    if (!e) return;
    resetSheetForm();
    editingItemId = null;
    initEventSelect();
    itemInput.value = e.name;
    qtyInput.value = e.qty || '';
    storeSelect.value = e.store || 'generico';
    eventSelect.value = e.eventId || '';
    window.setOperator(e.operator === 'B' ? 'B' : 'A');
    if (e.onOffer) {
      offerCheckbox.checked = true;
      offerWrapper.classList.add('checked');
      expiryWrapper.classList.add('show');
      pendingPrice = (e.price !== undefined && e.price !== null) ? e.price : null;
      offerConfirmed = true;
      expiryInput.value = e.expiryDate || '';
    }
    sheetTitle.innerHTML = '<i class="bi bi-plus-circle"></i> Nuovo prodotto';
    actionBtn.innerHTML = '<i class="bi bi-plus-circle-fill"></i> Aggiungi alla lista';
    deleteEditBtn.style.display = 'none';
    sheetOpen = true;
    sheetOverlay.classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(() => itemInput.focus(), 300);
  };

  window.removeFromHistory = function(idx) {
    history.splice(idx, 1);
    saveHistory();
    render();
  };

  function renderHistory() {
    const count = history.length;
    let body = '';
    if (historyOpen) {
      if (count === 0) {
        body = `<div class="history-body"><div class="history-empty">Nessun prodotto nello storico.<br>Spunta un prodotto come comprato per aggiungerlo qui.</div></div>`;
      } else {
        body = `<div class="history-body">` + history.map((e, idx) => {
          const st = getStore(e.store || 'generico');
          const ev = e.eventId ? getEvent(e.eventId) : null;
          return `
            <div class="history-item">
              <div class="history-info">
                <div class="history-name">${ev ? ev.emoji + ' ' : ''}${escapeHtml(e.name)}</div>
                <div class="history-meta">
                  <span class="history-store-dot" style="background:${st.color}"></span>
                  <span>${escapeHtml(st.name)}</span>
                  ${e.qty ? `<span>· ${escapeHtml(e.qty)}</span>` : ''}
                </div>
              </div>
              <div class="history-actions">
                <button class="hist-btn readd" onclick="window.readdFromHistory(${idx})" title="Rimetti identico"><i class="bi bi-arrow-counterclockwise"></i></button>
                <button class="hist-btn edit" onclick="window.editFromHistory(${idx})" title="Inserisci con modifiche"><i class="bi bi-pencil-fill"></i></button>
                <button class="hist-btn del" onclick="window.removeFromHistory(${idx})" title="Rimuovi"><i class="bi bi-x-lg"></i></button>
              </div>
            </div>
          `;
        }).join('') + `</div>`;
      }
    }
    return `
      <div class="history-section">
        <div class="history-header" onclick="window.toggleHistory()">
          <span class="history-title"><i class="bi bi-clock-history"></i> Storico acquisti</span>
          <span class="history-count">${count}/${HISTORY_MAX}</span>
          <span class="history-chevron ${historyOpen ? 'open' : ''}"><i class="bi bi-chevron-down"></i></span>
        </div>
        ${body}
      </div>
    `;
  }

  window.showQuickAdd = function(storeId) {
    quickAddOpenStore = (quickAddOpenStore === storeId) ? null : storeId;
    quickAddValue = '';
    if (quickAddOpenStore && collapsedStores.has(storeId)) {
      collapsedStores.delete(storeId);
      saveLocalSettings();
    }
    render();
  };

  window.hideQuickAdd = function() {
    quickAddOpenStore = null;
    quickAddValue = '';
    render();
  };

  window.quickAddInput = function(v) { quickAddValue = v; };

  window.quickAddKey = function(e, storeId) {
    if (e.key === 'Enter') { e.preventDefault(); window.confirmQuickAdd(storeId); }
    else if (e.key === 'Escape') { window.hideQuickAdd(); }
  };

  window.confirmQuickAdd = async function(storeId) {
    const input = document.getElementById('qa-input-' + storeId);
    if (!input) return;
    const name = (input.value || '').trim();
    if (!name) {
      input.style.borderColor = '#f43f5e';
      setTimeout(() => { input.style.borderColor = ''; }, 800);
      input.focus();
      return;
    }
    try {
      const payload = {
        name,
        qty: '',
        store: storeId,
        operator: currentOperator,
        onoffer: false,
        price: null,
        expiry_date: null,
        event_id: activeEventFilter || null,
        done: false
      };
      await safeInsert(payload);
      items.push({
        id: 'temp_' + Date.now(),
        ...payload,
        onOffer: false,
        expiryDate: null,
        eventId: payload.event_id,
        done: false
      });
      lastItemsCount = items.length;
      quickAddValue = '';
      render();
      setTimeout(() => loadItems(), 1000);
    } catch (err) {
      console.error('Errore:', err);
      alert('Errore: ' + err.message);
    }
  };

  async function safeInsert(payload) {
    const optionalKeys = ['event_id'];
    let p = payload;
    for (;;) {
      const { error } = await supabase.from('lista').insert(p);
      if (!error) return;
      const key = optionalKeys.find(k => k in p);
      if (!key) throw error;
      p = Object.assign({}, p);
      delete p[key];
    }
  }

  async function safeUpdate(payload, ids) {
    if (!ids.length) return;
    const optionalKeys = ['event_id'];
    let p = payload;
    for (;;) {
      const { error } = await supabase.from('lista').update(p).in('id', ids);
      if (!error) return;
      const key = optionalKeys.find(k => k in p);
      if (!key) throw error;
      p = Object.assign({}, p);
      delete p[key];
    }
  }

  async function loadItems() {
    try {
      const { data, error } = await supabase
        .from('lista')
        .select('*')
        .order('created_at', { ascending: true });
      
      if (error) throw error;
      
      const newItems = (data || []).map(row => ({
        id: row.id,
        name: row.name,
        qty: row.qty || '',
        store: row.store || 'generico',
        operator: row.operator || 'A',
        onOffer: row.onoffer === true,
        price: row.price,
        expiryDate: row.expiry_date || null,
        eventId: row.event_id || null,
        done: row.done === true
      }));
      
      const newCount = newItems.length;
      const hasChanges = newCount !== lastItemsCount || JSON.stringify(newItems) !== JSON.stringify(items);
      
      if (hasChanges) {
        items = newItems;
        lastItemsCount = newCount;
        statusEl.innerHTML = '<span class="dot"></span>Live';
        render();
      }
    } catch (err) {
      console.error('Errore:', err);
      statusEl.innerHTML = '<span class="dot" style="background:#ef4444"></span>Errore';
    }
  }

  supabase
    .channel('lista-changes')
    .on('postgres_changes', 
      { event: '*', schema: 'public', table: 'lista' }, 
      () => {
        clearTimeout(realtimeTimeout);
        realtimeTimeout = setTimeout(() => loadItems(), 500);
      }
    )
    .subscribe();

  setInterval(() => { loadItems(); }, 30000);

  function render() {
    let html = renderFilterRow();

    let base = items;
    if (activeEventFilter && !getEvents().some(e => e.id === activeEventFilter)) activeEventFilter = null;
    if (activeEventFilter) base = base.filter(i => i.eventId === activeEventFilter);

    let filteredItems = base;
    if (searchQuery.length > 0) {
      filteredItems = base.filter(it =>
        it.name.toLowerCase().includes(searchQuery) ||
        (it.qty && it.qty.toLowerCase().includes(searchQuery))
      );
    }

    const byStore = {};
    filteredItems.forEach(i => {
      const sid = i.store || 'generico';
      if (!byStore[sid]) byStore[sid] = [];
      byStore[sid].push(i);
    });
    const storeOrder = getStores().map(s => s.id).filter(id => byStore[id]);
    Object.keys(byStore).forEach(id => { if (!storeOrder.includes(id)) storeOrder.push(id); });

    if (items.length === 0) {
      html += `<div class="empty"><div class="empty-icon"><i class="bi bi-cart3"></i></div><h3>Lista vuota</h3><p>Tocca il + per aggiungere il primo prodotto</p></div>`;
    } else if (base.length === 0) {
      html += `<div class="empty"><div class="empty-icon"><i class="bi bi-stars"></i></div><h3>Nessun prodotto per questo evento</h3><p>Aggiungi prodotti o cambia filtro</p></div>`;
    } else if (storeOrder.length === 0) {
      html += `<div class="empty"><div class="empty-icon"><i class="bi bi-search"></i></div><h3>Nessun risultato</h3><p>Nessun prodotto trovato per "${escapeHtml(searchQuery)}"</p></div>`;
    } else {
      storeOrder.forEach(storeId => {
        const store = getStore(storeId);
        const storeItems = byStore[storeId];
        const pendingCount = storeItems.filter(i => !i.done).length;
        const isCollapsed = collapsedStores.has(storeId);
        
        html += `
          <div class="store-section">
            <div class="store-header ${isCollapsed ? 'collapsed' : ''}" onclick="window.toggleStore('${storeId}')">
              ${storeLogoHTML(store)}
              <div class="store-info">
                <div class="store-name">${escapeHtml(store.name)}</div>
                <div class="store-count">${pendingCount} da prendere · ${storeItems.length} totali</div>
              </div>
              <button class="store-add-btn" style="border-color:${store.color};color:${store.color}" onclick="event.stopPropagation(); window.showQuickAdd('${storeId}')" title="Aggiungi"><i class="bi bi-plus-lg"></i></button>
              <span class="collapse-icon ${isCollapsed ? 'rotated' : ''}"><i class="bi bi-chevron-down"></i></span>
            </div>
        `;
        
        if (quickAddOpenStore === storeId) {
          html += `
            <div class="quick-add-row">
              <div class="quick-add-input-wrap">
                <input type="text" class="quick-add-input" id="qa-input-${storeId}" placeholder="Nome prodotto..." autocomplete="off"
                  oninput="window.quickAddInput(this.value)"
                  onkeydown="window.quickAddKey(event,'${storeId}')">
                <button class="quick-add-confirm" onclick="window.confirmQuickAdd('${storeId}')"><i class="bi bi-check-lg"></i></button>
                <button class="quick-add-cancel" onclick="window.hideQuickAdd()"><i class="bi bi-x-lg"></i></button>
              </div>
            </div>
          `;
        }
        
        html += `<div class="store-items ${isCollapsed ? 'collapsed' : ''}" style="max-height: ${isCollapsed ? '0' : storeItems.length * 100 + 'px'}">`;
        storeItems.forEach(item => { html += renderItem(item, store); });
        html += `</div></div>`;
      });
    }

    html += renderHistory();
    listEl.innerHTML = html;
    
    if (!selectMode) {
      attachLongPressHandlers();
    }
    renderBulkBar();
    
    if (quickAddOpenStore) {
      const inp = document.getElementById('qa-input-' + quickAddOpenStore);
      if (inp) {
        if (inp.value !== quickAddValue) inp.value = quickAddValue;
        inp.focus();
      }
    }
  }

  function renderItem(item, store) {
    const opKey = item.operator === 'B' ? 'B' : 'A';
    const opName = getOpName(opKey);
    const opInitial = opName.charAt(0).toUpperCase();
    const isOffer = item.onOffer === true;
    const isExpired = isOffer && item.expiryDate && new Date(item.expiryDate) < new Date(new Date().toDateString());
    const ev = item.eventId ? getEvent(item.eventId) : null;
    const storeColor = store.color;
    
    let expiryHtml = '';
    if (isOffer && item.expiryDate) {
      const d = new Date(item.expiryDate);
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      expiryHtml = `<span class="expiry-text ${isExpired ? 'exp' : ''}"><i class="bi bi-calendar-event-fill"></i> ${dd}.${mm}</span>`;
    }
    const eventHtml = ev ? `<span class="event-badge" style="background:${storeColor}" title="${escapeHtml(ev.name)}">${ev.emoji ? ev.emoji : escapeHtml(ev.name)}</span>` : '';
    const priceHtml = (isOffer && item.price !== null && item.price !== undefined) ? `<span class="price-badge" style="background:${storeColor}">€${formatPrice(item.price)}</span>` : '';
    
    if (selectMode) {
      const sel = selectedIds.has(item.id);
      return `
        <div class="item-card selectable${sel ? ' selected' : ''}" style="--store-accent:${storeColor}" onclick="window.toggleSelect('${item.id}')" data-item-id="${item.id}">
          <div class="select-circle ${sel ? 'on' : ''}">${sel ? '<i class="bi bi-check-lg"></i>' : ''}</div>
          <div class="item-main">
            <div class="item-row">
              <div class="item-name">${escapeHtml(item.name)}</div>
              ${eventHtml}
            </div>
            <div class="item-meta">
              ${item.qty ? `<span class="item-qty">${escapeHtml(item.qty)}</span>` : ''}
              <div class="operator-badge op-${opKey.toLowerCase()}">${opInitial}</div>
              ${priceHtml}
            </div>
          </div>
        </div>
      `;
    }
    
    const stateCls = item.done ? ' done' : '';
    
    return `
      <div class="item-card${stateCls}" style="--store-accent:${storeColor}" data-item-id="${item.id}">
        <div class="todo-checkbox ${item.done ? 'checked' : ''}" onclick="window.toggleDone('${item.id}')" title="${item.done ? 'Segna come non comprato' : 'Segna come comprato'}">
          ${item.done ? '<i class="bi bi-check-lg"></i>' : ''}
        </div>
        <div class="item-main">
          <div class="item-row">
            <div class="item-name">${escapeHtml(item.name)}</div>
            ${eventHtml}
          </div>
          <div class="item-meta">
            ${item.qty ? `<span class="item-qty">${escapeHtml(item.qty)}</span>` : ''}
            <div class="operator-badge op-${opKey.toLowerCase()}" title="${opName}">${opInitial}</div>
            ${priceHtml}
            ${expiryHtml}
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function formatPrice(price) {
    if (price === null || price === undefined) return '0,00';
    const num = typeof price === 'string' ? parseFloat(price.replace(',', '.')) : price;
    if (isNaN(num)) return '0,00';
    return num.toFixed(2).replace('.', ',');
  }

  function parsePrice(priceStr) {
    if (!priceStr) return null;
    const cleaned = priceStr.replace(',', '.');
    const num = parseFloat(cleaned);
    return isNaN(num) ? null : num;
  }

  window.toggleDone = async function(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    
    item.done = !item.done;
    if (item.done) addToHistory(item);
    render();
    try {
      if (!id.startsWith('temp_')) {
        await supabase.from('lista').update({ done: item.done }).eq('id', id);
      }
    } catch (err) { console.error(err); }
  };

  function attachLongPressHandlers() {
    document.querySelectorAll('.item-card').forEach(card => {
      const itemId = card.dataset.itemId;
      if (!itemId) return;
      
      const startPress = (e) => {
        const target = e.target;
        if (target.closest('.todo-checkbox')) return;
        
        longPressTargetId = itemId;
        longPressTriggered = false;
        longPressTimer = setTimeout(() => {
          longPressTriggered = true;
          card.classList.add('pressing');
          if (navigator.vibrate) navigator.vibrate(50);
          setTimeout(() => {
            openEditSheet(itemId);
            card.classList.remove('pressing');
          }, 100);
        }, LONG_PRESS_DURATION);
      };
      
      const cancelPress = () => {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        longPressTargetId = null;
        card.classList.remove('pressing');
      };
      
      card.addEventListener('touchstart', startPress, { passive: true });
      card.addEventListener('touchend', cancelPress);
      card.addEventListener('touchmove', cancelPress);
      card.addEventListener('touchcancel', cancelPress);
      card.addEventListener('mousedown', startPress);
      card.addEventListener('mouseup', cancelPress);
      card.addEventListener('mouseleave', cancelPress);
      card.addEventListener('contextmenu', (e) => { if (longPressTriggered) e.preventDefault(); });
    });
  }

  function openEditSheet(itemId) {
    const item = items.find(i => i.id === itemId);
    if (!item) return;
    
    editingItemId = itemId;
    initEventSelect();
    itemInput.value = item.name;
    qtyInput.value = item.qty || '';
    storeSelect.value = item.store || 'generico';
    eventSelect.value = item.eventId || '';
    window.setOperator(item.operator === 'B' ? 'B' : 'A');
    
    offerCheckbox.checked = item.onOffer === true;
    if (item.onOffer) {
      offerWrapper.classList.add('checked');
      expiryWrapper.classList.add('show');
      pendingPrice = item.price;
      offerConfirmed = true;
    } else {
      offerWrapper.classList.remove('checked');
      expiryWrapper.classList.remove('show');
      pendingPrice = null;
      offerConfirmed = false;
    }
    expiryInput.value = item.expiryDate || '';
    
    isFavorite = favorites.some(f => f.name.toLowerCase() === item.name.toLowerCase());
    if (isFavorite) {
      favoriteStar.classList.add('active');
      favoriteStar.querySelector('.star').textContent = '★';
      favoriteStar.querySelector('.text').textContent = 'Rimosso dai preferiti';
    } else {
      favoriteStar.classList.remove('active');
      favoriteStar.querySelector('.star').textContent = '☆';
      favoriteStar.querySelector('.text').textContent = 'Salva come preferito';
    }
    
    sheetTitle.innerHTML = '<i class="bi bi-pencil-fill"></i> Modifica prodotto';
    actionBtn.innerHTML = '<i class="bi bi-check2-circle"></i> Salva modifiche';
    deleteEditBtn.style.display = 'flex';
    
    sheetOpen = true;
    sheetOverlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  window.handleSheetAction = async function() {
    if (editingItemId) await saveEditedItem();
    else await addItem();
  };

  async function saveEditedItem() {
    const name = itemInput.value.trim();
    if (!name) {
      itemInput.style.borderColor = '#f43f5e';
      itemInput.focus();
      setTimeout(() => { itemInput.style.borderColor = ''; }, 1000);
      return;
    }
    if (offerCheckbox.checked && !offerConfirmed) {
      openPriceModal();
      return;
    }
    try {
      const payload = {
        name,
        qty: qtyInput.value.trim(),
        store: storeSelect.value,
        operator: currentOperator,
        onoffer: offerCheckbox.checked,
        price: offerCheckbox.checked ? pendingPrice : null,
        expiry_date: (offerCheckbox.checked && expiryInput.value) ? expiryInput.value : null,
        event_id: eventSelect.value || null
      };
      await safeUpdate(payload, [editingItemId]);
      
      if (isFavorite) {
        const idx = favorites.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
        if (idx >= 0) favorites[idx] = { name, store: storeSelect.value };
        else favorites.push({ name, store: storeSelect.value });
        saveLocalSettings();
      } else {
        favorites = favorites.filter(f => f.name.toLowerCase() !== name.toLowerCase());
        saveLocalSettings();
      }
      
      const item = items.find(i => i.id === editingItemId);
      if (item) {
        Object.assign(item, {
          name, qty: payload.qty, store: payload.store, operator: payload.operator,
          onOffer: payload.onoffer, price: payload.price, expiryDate: payload.expiry_date,
          eventId: payload.event_id
        });
      }
      lastItemsCount = items.length;
      render();
      resetSheetForm();
      closeSheet();
      showSaveIndicator();
      setTimeout(() => loadItems(), 1000);
    } catch (err) {
      console.error('Errore:', err);
      alert('Errore: ' + err.message);
    }
  }

  window.deleteFromEdit = async function() {
    if (!editingItemId) return;
    if (!confirm('Eliminare questo prodotto?')) return;
    try {
      const item = items.find(i => i.id === editingItemId);
      if (item && item.done) addToHistory(item);
      if (!editingItemId.startsWith('temp_')) {
        await supabase.from('lista').delete().eq('id', editingItemId);
      }
      items = items.filter(i => i.id !== editingItemId);
      lastItemsCount = items.length;
      render();
      resetSheetForm();
      closeSheet();
      setTimeout(() => loadItems(), 1000);
    } catch (err) {
      console.error('Errore:', err);
      alert('Errore: ' + err.message);
    }
  };

  function resetSheetForm() {
    editingItemId = null;
    sheetTitle.innerHTML = '<i class="bi bi-plus-circle"></i> Nuovo prodotto';
    actionBtn.innerHTML = '<i class="bi bi-plus-circle-fill"></i> Aggiungi alla lista';
    deleteEditBtn.style.display = 'none';
    itemInput.value = '';
    qtyInput.value = '';
    offerCheckbox.checked = false;
    offerWrapper.classList.remove('checked');
    expiryWrapper.classList.remove('show');
    expiryInput.value = '';
    pendingPrice = null;
    offerConfirmed = false;
    isFavorite = false;
    favoriteStar.classList.remove('active');
    favoriteStar.querySelector('.star').textContent = '☆';
    favoriteStar.querySelector('.text').textContent = 'Salva come preferito';
  }

  window.toggleStore = function(id) {
    if (collapsedStores.has(id)) collapsedStores.delete(id);
    else collapsedStores.add(id);
    saveLocalSettings();
    render();
  };

  window.toggleSheet = function() {
    if (sheetOpen) closeSheet(); else openSheet();
  };

  function openSheet() {
    resetSheetForm();
    initEventSelect();
    eventSelect.value = activeEventFilter || '';
    sheetOpen = true;
    sheetOverlay.classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(() => { itemInput.focus(); }, 300);
  }

  window.closeSheet = function(e) {
    if (e && e.target !== sheetOverlay && e.target !== fabBtn) return;
    sheetOpen = false;
    sheetOverlay.classList.remove('show');
    document.body.style.overflow = '';
    autocompleteDropdown.classList.remove('show');
    resetSheetForm();
  };

  function openPriceModal() {
    priceInput.value = '';
    priceModal.classList.add('show');
    setTimeout(() => { priceInput.focus(); }, 100);
  }

  window.cancelOffer = function() {
    priceModal.classList.remove('show');
    offerCheckbox.checked = false;
    offerWrapper.classList.remove('checked');
    expiryWrapper.classList.remove('show');
    pendingPrice = null;
    offerConfirmed = false;
    expiryInput.value = '';
  };

  window.confirmPrice = function() {
    const price = priceInput.value.trim();
    const parsed = parsePrice(price);
    if (parsed !== null && parsed > 0) {
      pendingPrice = parsed;
      offerConfirmed = true;
      priceModal.classList.remove('show');
    } else {
      priceInput.style.borderColor = '#f43f5e';
      setTimeout(() => { priceInput.style.borderColor = ''; }, 1000);
    }
  };

  async function addItem() {
    const name = itemInput.value.trim();
    if (!name) {
      itemInput.style.borderColor = '#f43f5e';
      itemInput.focus();
      setTimeout(() => { itemInput.style.borderColor = ''; }, 1000);
      return;
    }
    if (offerCheckbox.checked && !offerConfirmed) {
      openPriceModal();
      return;
    }
    try {
      const payload = {
        name,
        qty: qtyInput.value.trim(),
        store: storeSelect.value,
        operator: currentOperator,
        onoffer: offerCheckbox.checked,
        price: offerCheckbox.checked ? pendingPrice : null,
        expiry_date: (offerCheckbox.checked && expiryInput.value) ? expiryInput.value : null,
        event_id: eventSelect.value || null,
        done: false
      };
      await safeInsert(payload);
      
      if (isFavorite) {
        const idx = favorites.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
        if (idx >= 0) favorites[idx] = { name, store: storeSelect.value };
        else favorites.push({ name, store: storeSelect.value });
        saveLocalSettings();
      }
      
      items.push({
        id: 'temp_' + Date.now(),
        ...payload,
        onOffer: payload.onoffer,
        expiryDate: payload.expiry_date,
        eventId: payload.event_id,
        done: false
      });
      lastItemsCount = items.length;
      render();
      resetSheetForm();
      closeSheet();
      setTimeout(() => loadItems(), 1000);
    } catch (err) {
      console.error('Errore:', err);
      alert('Errore: ' + err.message);
    }
  }

  window.magicWand = async function() {
    const doneItems = items.filter(i => i.done);
    if (doneItems.length === 0) {
      alert('Nessun prodotto comprato da eliminare!');
      return;
    }
    if (!confirm(`La bacchetta magica eliminerà ${doneItems.length} prodott${doneItems.length === 1 ? 'o' : 'i'} comprat${doneItems.length === 1 ? 'o' : 'i'}. Procedere?`)) return;
    try {
      doneItems.forEach(i => addToHistory(i));
      const ids = doneItems.map(i => i.id).filter(x => !x.startsWith('temp_'));
      items = items.filter(i => !i.done);
      lastItemsCount = items.length;
      render();
      if (ids.length) {
        const { error } = await supabase.from('lista').delete().in('id', ids);
        if (error) throw error;
      }
    } catch (err) {
      console.error(err);
      alert('Errore: ' + err.message);
    }
  };

  window.openSettings = function() {
    const ops = getOperators();
    document.getElementById('settingsOpA').value = ops.A;
    document.getElementById('settingsOpB').value = ops.B;
    iconPickerStoreId = null;
    renderStoresList();
    renderEventsList();
    updateDarkToggle();
    document.getElementById('settingsOverlay').classList.add('show');
  };

  window.closeSettings = function(e) {
    if (e && e.target !== document.getElementById('settingsOverlay')) return;
    document.getElementById('settingsOverlay').classList.remove('show');
  };

  function renderStoresList() {
    const container = document.getElementById('storesList');
    const stores = getStores();
    container.innerHTML = stores.map(s => {
      const pickerOpen = iconPickerStoreId === s.id;
      let panel = '';
      if (pickerOpen) {
        const currentIcon = s.icon || null;
        panel = `
          <div class="icon-picker-panel">
            <div class="ipp-title"><i class="bi bi-image"></i> Logo dalla cartella</div>
            <div class="ipp-grid">
              ${AVAILABLE_LOGOS.map(f => `
                <button class="ipp-img ${currentIcon && currentIcon.type === 'img' && currentIcon.src === f ? 'sel' : ''}" 
                        onclick="window.setStoreIconImg('${s.id}','${f}')" title="${f}">
                  <img src="${f}" onerror="this.parentElement.style.display='none'" alt="">
                </button>
              `).join('')}
            </div>
            <div class="ipp-title"><i class="bi bi-icons"></i> Icona generica</div>
            <div class="ipp-grid">
              ${BI_ICONS.map(n => `
                <button class="ipp-bi ${currentIcon && currentIcon.type === 'bi' && currentIcon.name === n ? 'sel' : ''}" 
                        onclick="window.setStoreIconBi('${s.id}','${n}')">
                  <i class="bi ${n}"></i>
                </button>
              `).join('')}
            </div>
            <button class="ipp-none" onclick="window.clearStoreIcon('${s.id}')"><i class="bi bi-type"></i> Solo iniziali colorate</button>
          </div>
        `;
      }
      return `
        <div class="settings-row">
          <button class="store-icon-btn" onclick="window.toggleIconPicker('${s.id}')" title="Cambia icona">
            ${storeLogoHTML(s, 'sz-xs')}
          </button>
          <input type="color" class="color-input" value="${s.color}" onchange="window.updateStoreColor('${s.id}', this.value)">
          <input type="text" value="${escapeHtml(s.name)}" onchange="window.updateStoreName('${s.id}', this.value)" maxlength="30">
          ${stores.length > 1 ? `<button class="delete-small" onclick="window.deleteStore('${s.id}')"><i class="bi bi-trash-fill"></i></button>` : ''}
        </div>
        ${panel}
      `;
    }).join('');
  }

  window.toggleIconPicker = function(id) {
    iconPickerStoreId = (iconPickerStoreId === id) ? null : id;
    renderStoresList();
  };

  window.setStoreIconImg = function(id, src) {
    const stores = getStores();
    const s = stores.find(x => x.id === id);
    if (s) s.icon = { type: 'img', src: src };
    customStores = stores;
    renderStoresList();
  };

  window.setStoreIconBi = function(id, name) {
    const stores = getStores();
    const s = stores.find(x => x.id === id);
    if (s) s.icon = { type: 'bi', name: name };
    customStores = stores;
    renderStoresList();
  };

  window.clearStoreIcon = function(id) {
    const stores = getStores();
    const s = stores.find(x => x.id === id);
    if (s) s.icon = null;
    customStores = stores;
    renderStoresList();
  };

  window.updateStoreName = function(id, name) {
    const stores = getStores();
    const s = stores.find(x => x.id === id);
    if (s) s.name = name.trim() || s.name;
    customStores = stores;
  };

  window.updateStoreColor = function(id, color) {
    const stores = getStores();
    const s = stores.find(x => x.id === id);
    if (s) s.color = color;
    customStores = stores;
  };

  window.deleteStore = function(id) {
    if (!confirm('Eliminare questo supermercato?')) return;
    customStores = getStores().filter(s => s.id !== id);
    if (iconPickerStoreId === id) iconPickerStoreId = null;
    renderStoresList();
  };

  window.addStore = function() {
    const name = document.getElementById('newStoreName').value.trim();
    const color = document.getElementById('newStoreColor').value;
    if (!name) { alert('Inserisci un nome'); return; }
    const id = 'custom_' + Date.now();
    customStores = getStores();
    customStores.push({ id, name, color, icon: null });
    document.getElementById('newStoreName').value = '';
    renderStoresList();
  };

  window.toggleDark = function() {
    isDark = !isDark;
    if (isDark) document.body.classList.add('dark');
    else document.body.classList.remove('dark');
    updateDarkToggle();
    saveLocalSettings();
    render();
  };

  window.saveSettings = async function() {
    const opA = document.getElementById('settingsOpA').value.trim() || 'Operatore A';
    const opB = document.getElementById('settingsOpB').value.trim() || 'Operatore B';
    customOperators = { A: opA, B: opB, events: getEvents() };
    await saveSharedSettings();
    syncOperatorUI();
    initStoreSelect();
    initEventSelect();
    iconPickerStoreId = null;
    document.getElementById('settingsOverlay').classList.remove('show');
    render();
  };

  window.openReorder = function() {
    renderReorderList();
    document.getElementById('reorderOverlay').classList.add('show');
  };

  window.closeReorder = function(e) {
    if (e && e.target !== document.getElementById('reorderOverlay')) return;
    document.getElementById('reorderOverlay').classList.remove('show');
  };

  function renderReorderList() {
    const container = document.getElementById('reorderList');
    const stores = getStores();
    const counts = {};
    items.forEach(i => {
      const sid = i.store || 'generico';
      counts[sid] = (counts[sid] || 0) + 1;
    });
    container.innerHTML = stores.map((store, index) => `
      <div class="reorder-item">
        <div class="position-num">${index + 1}</div>
        ${storeLogoHTML(store, 'sz-sm')}
        <div class="store-name">${escapeHtml(store.name)}</div>
        <div class="item-count-badge">${counts[store.id] || 0}</div>
        <div class="reorder-arrows">
          <button class="reorder-arrow" onclick="window.moveStore(${index}, -1)" ${index === 0 ? 'disabled' : ''}><i class="bi bi-chevron-up"></i></button>
          <button class="reorder-arrow" onclick="window.moveStore(${index}, 1)" ${index === stores.length - 1 ? 'disabled' : ''}><i class="bi bi-chevron-down"></i></button>
        </div>
      </div>
    `).join('');
  }

  window.moveStore = async function(index, direction) {
    const stores = getStores().slice();
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= stores.length) return;
    const temp = stores[index];
    stores[index] = stores[newIndex];
    stores[newIndex] = temp;
    customStores = stores;
    renderReorderList();
    render();
    await saveSharedSettings();
  };

  window.exportPDF = function() {
    if (items.length === 0) {
      alert('La lista è vuota!');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const today = new Date().toLocaleDateString('it-IT');
    
    doc.setFillColor(99, 102, 241);
    doc.rect(0, 0, 210, 30, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(22);
    doc.setFont(undefined, 'bold');
    doc.text('Lista Spesa - Marbon', 14, 14);
    doc.setFontSize(10);
    doc.setFont(undefined, 'normal');
    doc.text(`Generata il ${today}`, 14, 22);
    
    let exportItems = items;
    if (activeEventFilter) exportItems = items.filter(i => i.eventId === activeEventFilter);
    
    const byStore = {};
    exportItems.forEach(i => {
      const storeId = i.store || 'generico';
      if (!byStore[storeId]) byStore[storeId] = [];
      byStore[storeId].push(i);
    });
    const storeOrder = getStores().map(s => s.id).filter(id => byStore[id]);
    Object.keys(byStore).forEach(id => { if (!storeOrder.includes(id)) storeOrder.push(id); });
    
    let yPos = 40;
    storeOrder.forEach(storeId => {
      const store = getStore(storeId);
      const storeItems = byStore[storeId];
      if (yPos > 270) { doc.addPage(); yPos = 20; }
      doc.setFillColor(99, 102, 241);
      doc.roundedRect(14, yPos - 6, 182, 10, 2, 2, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(12);
      doc.setFont(undefined, 'bold');
      doc.text(`${store.name} (${storeItems.length})`, 18, yPos);
      yPos += 12;
      const tableData = storeItems.map(item => {
        const opName = getOpName(item.operator === 'B' ? 'B' : 'A');
        const price = item.onOffer && item.price ? `${formatPrice(item.price)} €` : '-';
        const offer = item.onOffer ? 'Sì' : '';
        const expiry = item.expiryDate ? new Date(item.expiryDate).toLocaleDateString('it-IT') : '';
        const status = item.done ? '✓' : '';
        const ev = item.eventId ? getEvent(item.eventId) : null;
        const nameWithEvent = ev ? `${ev.emoji} ${item.name}` : item.name;
        return [nameWithEvent, item.qty || '-', opName, price, offer, expiry, status];
      });
      doc.autoTable({
        startY: yPos,
        head: [['Prodotto', 'Qtà', 'Operatore', 'Prezzo', 'Offerta', 'Scadenza', 'Fatto']],
        body: tableData,
        theme: 'grid',
        headStyles: { fillColor: [99, 102, 241], textColor: 255, fontSize: 9 },
        bodyStyles: { fontSize: 9, textColor: [30, 41, 59] },
        alternateRowStyles: { fillColor: [248, 250, 252] },
        margin: { left: 14, right: 14 },
        styles: { cellPadding: 3, lineColor: [226, 232, 240], lineWidth: 0.3 },
      });
      yPos = doc.lastAutoTable.finalY + 10;
    });
    
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      doc.setFontSize(8);
      doc.setTextColor(148, 163, 184);
      doc.text(`Pagina ${i} di ${totalPages}`, 105, 290, { align: 'center' });
    }
    doc.save(`lista-spesa-${today.replace(/\//g, '-')}.pdf`);
  };

  priceModal.addEventListener('click', (e) => {
    if (e.target === priceModal) window.cancelOffer();
  });
  priceInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') window.confirmPrice();
  });
  priceInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/[^0-9.,]/g, '');
  });
  itemInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.handleSheetAction(); });
  qtyInput.addEventListener('keypress', e => { if (e.key === 'Enter') window.handleSheetAction(); });

  loadLocalSettings();
  loadSharedSettings();
  loadItems();
</script>
</body>
</html>
